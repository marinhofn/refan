[project]
name = "refan"
version = "2.0.0"
description = "Classificação de refatorações de código com LLMs — ferramenta de pesquisa acadêmica"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "José Marinho Falcão Neto", email = "jose.marinho.neto@ccc.ufcg.edu.br"},
]
keywords = ["refactoring", "llm", "software-engineering", "classification", "ollama"]
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "plotly>=5.22",
    "kaleido>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-mock",
]
json5 = ["json5>=0.9"]
supabase = [
    "supabase>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
refan = "cli:run_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: testes que requerem Ollama ou rede",
    "integration: testes de integração com CSVs reais",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
